name: DataTug
description: Install the verified DataTug CLI and validate a project or run named Checks
author: datatug
branding:
  icon: check-circle
  color: blue

inputs:
  mode:
    description: 'Operation: validate (backward-compatible default) or checks'
    required: false
    default: validate
  dir:
    description: Relative path to the DataTug project directory in the workspace
    required: false
    default: ''
  version:
    description: Stable DataTug CLI version without a v prefix; defaults to latest stable
    required: false
    default: ''
  environment:
    description: Named DataTug environment to use in checks mode
    required: false
    default: ''
  checks:
    description: Newline-separated named Check IDs to run in checks mode
    required: false
    default: ''
  local-owner:
    description: Explicit consent for the CLI local-owner execution mode
    required: false
    default: 'false'
  timeout:
    description: Per-invocation timeout from 1s through 3600s or 1m through 60m (for example 30s)
    required: false
    default: 30s
  warnings:
    description: Whether Check warnings fail the action (fail) or are ignored (ignore)
    required: false
    default: fail
  endpoint:
    description: Optional execution endpoint; currently unsupported and rejected if set
    required: false
    default: ''

  publish-summary:
    description: Explicitly upload a minimal client-reported summary with seven-day retention
    required: false
    default: 'false'
  summary-space:
    description: Hosted Space containing the matching project and Check versions
    required: false
    default: ''
  summary-token:
    description: DataTug bearer token supplied from a GitHub secret for optional summary upload
    required: false
    default: ''

outputs:
  version:
    description: Version of the installed DataTug CLI
    value: ${{ steps.install.outputs.version }}
  path:
    description: Absolute path to the installed DataTug executable
    value: ${{ steps.install.outputs.path }}
  cache-hit:
    description: Whether the verified CLI archive came from the Actions cache
    value: ${{ steps.cli-cache.outputs.cache-hit }}
  status:
    description: Safe top-level Checks status in checks mode
    value: ${{ steps.checks.outputs.status }}
  exit-code:
    description: DataTug Checks exit code in checks mode
    value: ${{ steps.checks.outputs.exit-code }}
  result-json:
    description: Sanitized DataTug result envelope in checks mode
    value: ${{ steps.checks.outputs.result-json }}

runs:
  using: composite
  steps:
    - name: Validate operation mode
      shell: bash
      env:
        DATATUG_MODE: ${{ inputs.mode }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" mode

    - name: Resolve verified DataTug release
      id: release
      shell: bash
      env:
        DATATUG_GITHUB_TOKEN: ${{ github.token }}
        DATATUG_CLI_VERSION: ${{ inputs.version }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" resolve

    - name: Restore verified CLI archive
      id: cli-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6
      with:
        path: ${{ runner.temp }}/datatug-cli-cache/${{ steps.release.outputs.archive }}
        key: ${{ steps.release.outputs.cache-key }}

    - name: Download CLI archive on a cache miss
      if: steps.cli-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        DATATUG_RELEASE_TAG: ${{ steps.release.outputs.tag }}
        DATATUG_ARCHIVE: ${{ steps.release.outputs.archive }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" download

    - name: Verify CLI archive checksum
      shell: bash
      env:
        DATATUG_ARCHIVE: ${{ steps.release.outputs.archive }}
        DATATUG_EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" verify

    - name: Save verified CLI archive
      if: steps.cli-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # actions/cache v6
      with:
        path: ${{ runner.temp }}/datatug-cli-cache/${{ steps.release.outputs.archive }}
        key: ${{ steps.release.outputs.cache-key }}

    - name: Install verified CLI
      id: install
      shell: bash
      env:
        DATATUG_ARCHIVE: ${{ steps.release.outputs.archive }}
        DATATUG_EXPECTED_VERSION: ${{ steps.release.outputs.version }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" install

    - name: Validate DataTug project
      if: inputs.mode == 'validate'
      shell: bash
      env:
        DATATUG_CLI: ${{ steps.install.outputs.path }}
        DATATUG_PROJECT_DIR: ${{ inputs.dir }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" validate

    - name: Run DataTug Checks
      id: checks
      if: inputs.mode == 'checks'
      shell: bash
      env:
        DATATUG_CLI: ${{ steps.install.outputs.path }}
        DATATUG_PROJECT_DIR: ${{ inputs.dir }}
        DATATUG_MODE: ${{ inputs.mode }}
        DATATUG_ENVIRONMENT: ${{ inputs.environment }}
        DATATUG_CHECKS: ${{ inputs.checks }}
        DATATUG_LOCAL_OWNER: ${{ inputs.local-owner }}
        DATATUG_TIMEOUT: ${{ inputs.timeout }}
        DATATUG_WARNINGS: ${{ inputs.warnings }}
        DATATUG_ENDPOINT: ${{ inputs.endpoint }}
        DATATUG_PUBLISH_SUMMARY: ${{ inputs.publish-summary }}
        DATATUG_SUMMARY_SPACE: ${{ inputs.summary-space }}
        DATATUG_SUMMARY_TOKEN: ${{ inputs.summary-token }}
        GITHUB_WORKSPACE: ${{ github.workspace }}
      run: bash "${{ github.action_path }}/scripts/datatug-cli.sh" checks
